[package]
name = "thermometer"
version = "0.1.0"
edition = "2021"

[dependencies]
ds18b20 = { git = "https://github.com/ippras-blc/ds18b20" }
esp-idf-svc = { version = "0.49.1", default-features = false, features = [
    "std",
] }
log = { version = "0.4.22", default-features = false }
thiserror = "1.0.64"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "onewire_bus", version = "^1.0.2" }

[build-dependencies]
embuild = "0.32.0"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]
pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
    "esp-idf-svc/embassy-sync",
    "esp-idf-svc/critical-section",
    "esp-idf-svc/embassy-time-driver",
]

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys", rev = "2728b85" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal", rev = "aa0e257" }
